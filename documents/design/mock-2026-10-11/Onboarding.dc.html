<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First launch window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#1f6fd6}a:hover{color:#174f99}
</style>
</helmet>
<div style="width: 520px; height: 440px; box-sizing: border-box; background: #ffffff; border: 1px solid #c9c9ce; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,0.2); display: flex; flex-direction: column; color: #1c1c1e; font-size: 13px; overflow: hidden">
  <div style="height: 38px; flex: none; display: flex; align-items: center; justify-content: center; background: #ececef; border-bottom: 1px solid #d6d6db; font-weight: 600; font-size: 13px; position: relative">
    <div style="position: absolute; left: 12px; top: 12px; display: flex; gap: 8px" aria-hidden="true"><span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span></div>
    Welcome to PasteCheck
  </div>
  <div style="padding: 20px 24px 16px; display: flex; flex-direction: column; gap: 14px; flex: 1">
    <div style="font-size: 12px; color: #4a4a50; line-height: 1.45">PasteCheck watches what you copy and warns you before you paste a secret. Everything stays on this Mac. Three things make it work.</div>
    <sc-for list="{{steps}}" as="step" hint-placeholder-count="3">
      <div style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1px solid #e2e2e6; border-radius: 10px">
        <div style="width: 28px; height: 28px; flex: none; border-radius: 7px; background: #eef4fc; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1f6fd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
          <div style="font-weight: 600">{{step.title}}</div>
          <div style="font-size: 12px; color: #4a4a50; line-height: 1.4">{{step.body}}</div>
        </div>
        <button style="min-height: 28px; flex: none; padding: 0 12px; background: #f2f2f4; border: 1px solid #d0d0d5; border-radius: 7px; font: inherit; color: #1c1c1e; cursor: pointer">{{step.action}}</button>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 24px 16px; border-top: 1px solid #e2e2e6">
    <a href="#" style="font-size: 12px">How PasteCheck handles your clipboard</a>
    <button style="min-height: 30px; padding: 0 16px; background: #1f6fd6; border: 0; border-radius: 7px; font: inherit; font-weight: 600; color: #ffffff; cursor: pointer">Start watching</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      steps: [
        { title: 'Allow clipboard access', body: 'macOS will ask when PasteCheck first reads the clipboard. Choose Always Allow so checks run without a prompt each time.', action: 'Allow' },
        { title: 'Allow notifications', body: 'Warnings arrive as notifications. They name the kind of secret and where it sits, never the value itself.', action: 'Allow' },
        { title: 'Link SecChain (optional)', body: 'Warn when your own saved secrets are copied, not just look-alikes. Values never leave SecChain.', action: 'Link' }
      ]
    };
  }
}
</script>
</body>
</html>
