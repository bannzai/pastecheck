<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} — PasteCheck</title>
    <!-- There is no _config.yml, so site.baseurl does not exist and an absolute path would point outside the project site.
         Every legal page sits one level below the site root -->
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <style>
      /* The landing page is a standalone document with its own styles. The legal pages only need to be
         readable on a smartphone and in a reviewer's browser */
      body {
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
        max-width: 42rem;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif;
        line-height: 1.8;
        color: #1c1c1e;
        background: #ffffff;
      }
      h1 { font-size: 1.9rem; }
      h2 { margin-top: 2.5rem; }
      h3 { margin-top: 1.75rem; }
      code { background: #f2f2f7; padding: 0.1em 0.35em; border-radius: 4px; }
      a { color: #0a63c9; }
      nav { margin-bottom: 2rem; font-size: 0.9rem; }
      @media (prefers-color-scheme: dark) {
        body { color: #f2f2f7; background: #111114; }
        code { background: #26262b; }
        a { color: #6cb0ff; }
      }
    </style>
  </head>
  <body>
    <nav><a href="../">PasteCheck</a></nav>
    {{ content }}
  </body>
</html>
