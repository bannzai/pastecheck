# Opens the public site (docs/) in Chromium on a GitHub Actions Linux runner so that the local
# agent-browser can operate it and take screenshots over Tailscale. This is the path for checking how the
# landing page and legal documents are displayed without running a browser on the local Mac (AGENTS.md
# "Checking the public site"). The implementation is webtunnel's reusable workflow ("各アプリ repo での実行"
# in PROJECT.md of https://github.com/bannzai/webtunnel).
name: browser-session
# local/webtunnel identifies the run by this run-name (keep the form that starts with session=<name>)
run-name: "session=${{ inputs.session }} duration=${{ inputs.duration_minutes }}m"

on:
  # Manual dispatch only, so that Tailscale secrets are not passed to PRs from forks
  workflow_dispatch:
    # local/webtunnel's up always sends session / duration_minutes and also sends optional options to the
    # matching inputs, so declare all of them to keep the dispatch from being rejected for an undeclared input
    inputs:
      session:
        description: "Session name. The runner joins the tailnet as webtunnel-<session>"
        required: true
        default: pastecheck-web
      duration_minutes:
        description: "Minutes to keep the session open"
        required: true
        default: "60"
      start_url:
        required: false
        default: ""
      record:
        required: false
        default: "true"
      preview:
        required: false
        default: "true"
      setup_script:
        required: false
        default: ".webtunnel/setup.sh"
      software_webgl:
        required: false
        default: "false"

jobs:
  session:
    # Only this job, which calls the reusable workflow, receives the OIDC token
    permissions:
      id-token: write
      contents: read
    # webtunnel has no release tags, so pin to a commit on main
    uses: bannzai/webtunnel/.github/workflows/session.yml@7779e49fc4663f2c53a74ff4da55a9ca56b8ceda # main 2026-10-07
    with:
      session: ${{ inputs.session }}
      duration_minutes: ${{ inputs.duration_minutes }}
      start_url: ${{ inputs.start_url }}
      record: ${{ inputs.record }}
      preview: ${{ inputs.preview }}
      setup_script: ${{ inputs.setup_script }}
      software_webgl: ${{ inputs.software_webgl }}
      # The public site is static files only, so serve the same docs/ as GitHub Pages with Python's http.server.
      # Without binding to 127.0.0.1, the reusable workflow's loopback check fails
      start_command: python3 -m http.server "$PORT" --bind 127.0.0.1 --directory docs
      port: "8000"
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
