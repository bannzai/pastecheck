# 公開サイト (docs/) を GitHub Actions の Linux runner 上の Chromium で開き、Tailscale 経由でローカルの
# agent-browser から操作・スクリーンショット取得できるようにする。ローカルの Mac でブラウザを動かさずに
# LP・法務ドキュメントの表示を確認するための経路 (AGENTS.md「公開サイトの確認」)。実体は webtunnel の
# reusable workflow (https://github.com/bannzai/webtunnel の PROJECT.md「各アプリ repo での実行」)。
name: browser-session
# local/webtunnel はこの run-name で run を特定する (session=<名前> で始まる形を維持する)
run-name: "session=${{ inputs.session }} duration=${{ inputs.duration_minutes }}m"

on:
  # fork からの PR に Tailscale の secrets を渡さないため手動 dispatch だけにする
  workflow_dispatch:
    # local/webtunnel の up は session / duration_minutes を常に送り、任意オプションも対応する input に
    # 送るため、未宣言の input で dispatch が拒否されないように全部を宣言する
    inputs:
      session:
        description: "セッション名。runner は webtunnel-<session> として tailnet に参加する"
        required: true
        default: pastecheck-web
      duration_minutes:
        description: "セッションを維持する分数"
        required: true
        default: "60"
      start_url:
        required: false
        default: ""
      record:
        required: false
        default: "true"
      preview:
        required: false
        default: "true"
      setup_script:
        required: false
        default: ".webtunnel/setup.sh"
      software_webgl:
        required: false
        default: "false"

jobs:
  session:
    # reusable workflow を呼ぶこの job だけが OIDC token を受け取る
    permissions:
      id-token: write
      contents: read
    # webtunnel にはリリースタグが無いため main の commit で固定する
    uses: bannzai/webtunnel/.github/workflows/session.yml@7779e49fc4663f2c53a74ff4da55a9ca56b8ceda # main 2026-10-07
    with:
      session: ${{ inputs.session }}
      duration_minutes: ${{ inputs.duration_minutes }}
      start_url: ${{ inputs.start_url }}
      record: ${{ inputs.record }}
      preview: ${{ inputs.preview }}
      setup_script: ${{ inputs.setup_script }}
      software_webgl: ${{ inputs.software_webgl }}
      # 公開サイトは静的ファイルだけなので、GitHub Pages と同じ docs/ を Python の http.server で配信する。
      # 127.0.0.1 に束縛しないと reusable workflow の loopback 検証で失敗する
      start_command: python3 -m http.server "$PORT" --bind 127.0.0.1 --directory docs
      port: "8000"
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
