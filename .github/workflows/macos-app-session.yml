# Opens the macOS app in the desktop session of a GitHub Actions macOS runner and exposes it to the
# maintainer's tailnet via WebDriverAgentMac. A workflow for checking screens without launching the app on the local Mac.
# The implementation is simtunnel's reusable workflow (https://github.com/bannzai/simtunnel).
name: macos-app-session
# local/simtunnel identifies the run by this name (it must start with session=<name>).
run-name: "session=${{ inputs.session }} runner=${{ inputs.runner }}"

on:
  # Manual runs only, so that Tailscale secrets are not passed to pull requests from forks.
  workflow_dispatch:
    # local/simtunnel always sends session / device / duration_minutes, and undeclared inputs are rejected.
    inputs:
      session:
        description: "Session name. The runner joins the tailnet as simtunnel-<session> (lowercase letters, digits, hyphens)"
        required: true
        default: pastecheck-mac
      device:
        description: "Not used on macOS. Declared because local/simtunnel sends it"
        required: false
        default: "-"
      duration_minutes:
        description: "Minutes to keep the session open"
        required: true
        default: "60"
      runner:
        description: "Label of the macOS runner"
        required: false
        default: macos-26

jobs:
  session:
    # Only the job that calls the reusable workflow gets the OIDC token.
    permissions:
      id-token: write # Tailscale authenticates the runner with OIDC
      contents: read
    # simtunnel has no release tags, so pin a commit on main.
    uses: bannzai/simtunnel/.github/workflows/macos-session.yml@2fe90069d18a233f073d99683b6aaef2eedef2e4 # main 2026-10-07
    with:
      session: ${{ inputs.session }}
      runner: ${{ inputs.runner }}
      duration_minutes: ${{ inputs.duration_minutes }}
      build_project: PasteCheck.xcodeproj
      build_scheme: PasteCheck
      # Every configuration uses ad-hoc signing, so a runner without a signing identity can still build Debug.
      build_configuration: Debug
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
