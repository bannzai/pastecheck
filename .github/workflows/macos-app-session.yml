# GitHub Actions の macOS runner のデスクトップセッションで macOS アプリを開き、WebDriverAgentMac 経由で
# メンテナの tailnet に公開する。ローカルの Mac でアプリを起動せずに画面を確認するための workflow。
# 実体は simtunnel の reusable workflow (https://github.com/bannzai/simtunnel)。
name: macos-app-session
# local/simtunnel はこの名前で run を特定する (session=<name> で始まる必要がある)。
run-name: "session=${{ inputs.session }} runner=${{ inputs.runner }}"

on:
  # fork からの pull request に Tailscale の secrets を渡さないため、手動実行だけにする。
  workflow_dispatch:
    # local/simtunnel は session / device / duration_minutes を必ず送り、宣言の無い input は拒否される。
    inputs:
      session:
        description: "セッション名。runner は simtunnel-<session> として tailnet に参加する (小文字・数字・ハイフン)"
        required: true
        default: pastecheck-mac
      device:
        description: "macOS では使わない。local/simtunnel が送るため宣言している"
        required: false
        default: "-"
      duration_minutes:
        description: "セッションを開いておく分数"
        required: true
        default: "60"
      runner:
        description: "macOS runner のラベル"
        required: false
        default: macos-26

jobs:
  session:
    # reusable workflow を呼ぶ job だけが OIDC token を得る。
    permissions:
      id-token: write # Tailscale が OIDC で runner を認証する
      contents: read
    # simtunnel にはリリースタグが無いため、main の commit を固定する。
    uses: bannzai/simtunnel/.github/workflows/macos-session.yml@2fe90069d18a233f073d99683b6aaef2eedef2e4 # main 2026-10-07
    with:
      session: ${{ inputs.session }}
      runner: ${{ inputs.runner }}
      duration_minutes: ${{ inputs.duration_minutes }}
      build_project: PasteCheck.xcodeproj
      build_scheme: PasteCheck
      # 全 configuration が ad-hoc 署名のため、署名 identity の無い runner でも Debug のままビルドできる。
      build_configuration: Debug
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
