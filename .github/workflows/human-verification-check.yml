name: human-verification-check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  human-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Detect unchecked items in "## 人間が確認"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Line endings in the PR body can contain CRLF, so strip CR first and then match line by line
          body=$(printf '%s\n' "$PR_BODY" | tr -d '\r')
          # PRs without the section (auto-generated PRs that skip the template, such as dependabot) are out of scope and pass.
          # The heading stays in Japanese because PR bodies are written in Japanese (AGENTS.md "Language")
          section=$(printf '%s\n' "$body" | awk '/^## 人間が確認 *$/{flag=1; next} /^## /{flag=0} flag')
          if [ -z "$section" ]; then
            echo "No \"## 人間が確認\" section, so there is nothing to check"
            exit 0
          fi
          unchecked=$(printf '%s\n' "$section" | grep -Ec '^[[:space:]]*([-*+]|[0-9]+[.)])[[:space:]]+\[ \]' || true)
          if [ "$unchecked" -gt 0 ]; then
            printf '%s\n' "$section" | grep -En '^[[:space:]]*([-*+]|[0-9]+[.)])[[:space:]]+\[ \]'
            echo "::error::\"## 人間が確認\" has ${unchecked} unchecked item(s). A human must verify them and check them off"
            exit 1
          fi
          echo "All items in \"## 人間が確認\" are checked"
